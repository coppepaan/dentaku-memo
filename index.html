<style>
/* Layout: one-screen notebook — file-index tabs joined to the white sheet, numbered lines (式 | 答え), keypad pinned below. Monochrome: white paper, black ink; the only color is the archive action. */
:root{
  --bg:#F3F3F3;
  --ink:#111111;
  --sub:#8A8A8A;
  --line:#E2E2E2;
  --soft:#FFFFFF;
  --press:#EAEAEA;
  --red:#FF4747;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Manrope","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;background:var(--bg)}

/* header */
.top{padding:12px 10px 0 10px}
.toprow{display:flex;align-items:flex-end;gap:6px;min-width:0}
.tags{display:flex;align-items:flex-end;flex:1;min-width:0;padding-left:0}
.tagb{position:relative;flex:0 1 60px;min-width:44px;height:40px;margin-right:-8px;padding:0;border:none;border-radius:14px 14px 0 0;
  background:#E2E2E2;color:var(--sub);font-weight:400;font-size:15px;touch-action:manipulation;z-index:1;
  transition:background .2s,color .2s;box-shadow:inset -1px 0 0 rgba(0,0,0,.05)}
.tagb:nth-child(3){z-index:2}.tagb:nth-child(2){z-index:3}.tagb:nth-child(1){z-index:4}.tagb:last-child{margin-right:0}
.tagb[aria-selected="true"]{background:#FFFFFF;color:var(--ink);font-weight:800;z-index:5;box-shadow:none}
.tagb.pop{animation:tabin .28s ease-out}
@keyframes tabin{0%{background:#E2E2E2;color:var(--sub)}100%{background:#FFFFFF}}
.sheet.fade{animation:fadein .28s ease-out}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.fade{animation:none}}
@media (prefers-reduced-motion:reduce){.tagb.pop{animation:none}}
.tagb[aria-selected="true"]::after{content:"";position:absolute;bottom:0;right:-14px;width:14px;height:14px;background:radial-gradient(circle at 100% 0,transparent 13.5px,#FFFFFF 14px)}
.tagb:not(:first-child)[aria-selected="true"]::before{content:"";position:absolute;bottom:0;left:-14px;width:14px;height:14px;background:radial-gradient(circle at 0 0,transparent 13.5px,#FFFFFF 14px)}
.acts{display:flex;align-items:center;gap:6px;flex:none;padding-bottom:6px}
@media (prefers-reduced-motion:reduce){.tagb{transition:none}}
.ib{height:34px;width:34px;border-radius:999px;border:none;background:var(--soft);color:var(--ink);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .n{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:#fff;font-size:10px;font-family:var(--f-num);line-height:16px;padding:0 4px}
.ib .n[hidden]{display:none}
.arch{flex:none;height:34px;border:1.5px solid #A3A3A3;background:transparent;color:#5C5C5C;border-radius:999px;padding:0 11px 0 9px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap}
.arch svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arch:active{background:var(--soft)}
.arch svg{width:15px;height:15px;overflow:visible;stroke-width:2.2}
.arch .rays{transform-origin:12px 12px}
.arch.blow .rays{animation:burst .6s cubic-bezier(.2,.9,.3,1)}
@keyframes burst{0%{transform:scale(.55) rotate(0);opacity:.4}55%{transform:scale(1.25) rotate(15deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.arch.blow .rays{animation:none}}

/* sheet */
.paper{display:flex;flex-direction:column;min-height:0;background:#FFFFFF;margin:0 10px 8px;border-radius:18px;position:relative;z-index:6}
.app.first .paper{border-top-left-radius:0}
.paperbar{display:flex;justify-content:flex-end;padding:10px 10px 0}
.sheet{flex:1;overflow-y:auto;min-height:0;padding-block:2px 24px}
.row{display:grid;grid-template-columns:2.4em minmax(0,1fr) minmax(0,40%);min-height:42px;border-radius:12px;margin-inline:8px}
.row.cur .ln{color:var(--ink);font-weight:700}
.row,.ghost{cursor:text}
.ghost .ln{opacity:.45}
.ln{font-family:var(--f-num);font-size:11px;color:var(--sub);text-align:right;padding:14px 8px 0 0;position:relative}
.row.chained .ln::before{content:"";position:absolute;right:-2px;top:-8px;height:24px;width:8px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);border-bottom-left-radius:7px}
.ex{border:none;background:transparent;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;font-size:18px;line-height:26px;color:var(--ink);padding:8px 4px;width:100%;min-width:0;caret-color:var(--ink);white-space:pre;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-user-select:text;user-select:text}
.ex::-webkit-scrollbar{display:none}
.ex .tx{color:#A6A6A6;font-family:var(--f-ui);font-size:13px;font-weight:500}
.ex:focus{outline:none}
.res{font-family:var(--f-num);font-size:18px;font-weight:500;padding:8px 12px 8px 6px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto;scrollbar-width:none;display:flex;align-items:center;justify-content:flex-end;color:var(--ink)}
.res::-webkit-scrollbar{display:none}
.res.used{color:var(--sub);font-weight:400}
.res.err{font-family:var(--f-ui);font-size:12px;color:var(--red)}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.pad.hide .k:not(.keep){display:none}
.k{border:none;background:var(--soft);border-radius:14px;height:clamp(50px,8vh,66px);font-family:var(--f-num);font-size:24px;font-weight:500;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s}
.k.op{background:var(--bg);border:1.5px solid var(--ink);font-size:36px;font-weight:400}
.k.op.par{font-size:22px}
.k.sm{height:clamp(34px,4.6vh,40px);background:transparent;color:var(--sub);font-family:var(--f-ui);font-size:13px;font-weight:700}
.k.sm[aria-pressed="true"]{background:var(--ink);color:#fff}
.k.enter{background:var(--ink);color:#fff;font-size:28px}
.k.pressed{transform:scale(.93)}
.k[data-k="bs"]{font-family:system-ui,sans-serif;font-size:24px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:82%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.phead{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
.phead h2{font-size:16px;margin:0}
.x{border:none;background:var(--soft);border-radius:999px;width:30px;height:30px;font-size:15px;color:var(--ink)}
.pbody{overflow-y:auto;padding:4px 18px 20px}
.sub{font-size:12px;color:var(--sub);margin:0 0 8px}
.aitem{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
.ahead{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 10px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:13px}
.ahead span{font-size:12px;color:var(--sub);white-space:nowrap}
.apre{font-family:var(--f-num);font-size:13px;white-space:pre;overflow-x:auto;line-height:1.55;background:var(--soft);border-radius:12px;padding:8px 12px}
.afoot{display:flex;justify-content:flex-end;gap:8px}
.btn{border:none;background:var(--soft);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}
.btn.pri{background:var(--ink);color:#fff}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.4}
.empty{color:var(--sub);font-size:13px;padding:24px 0;text-align:center;line-height:1.7}
.help{display:grid;gap:14px;font-size:14px;line-height:1.75}
.help h3{font-size:13px;margin:0 0 2px}
.help p{margin:0;color:#444}
.help code{font-family:var(--f-num);background:var(--soft);padding:1px 6px;border-radius:6px;color:var(--ink)}
.dlg{display:grid;gap:12px}
.dlg label{font-size:12px;color:var(--sub)}
.dlg input{font:inherit;font-size:16px;padding:10px 14px;border:none;border-radius:12px;background:var(--soft);color:var(--ink);width:100%}
.dlg .row2{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dlg .row2 div{display:flex;gap:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(320px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;display:flex;gap:14px;align-items:center;z-index:30;max-width:calc(100% - 32px);white-space:nowrap}
.toast button{border:none;background:transparent;color:#fff;font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s cubic-bezier(.3,1.3,.5,1)}@keyframes up{from{transform:translateY(30px)}}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="toprow">
      <div class="tags" id="tags" role="tablist" aria-label="計算タグ"></div>
      <div class="acts">
      <button class="ib" id="btnArchive" title="アーカイブ" aria-label="アーカイブを見る">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>
        <span class="n" id="archN" hidden>0</span>
      </button>
      <button class="ib" id="btnHelp" title="使い方" aria-label="使い方">?</button>
      </div>
    </div>
  </header>

  <section class="paper">
    <div class="paperbar">
      <button class="arch" id="btnClear" title="すべてクリア" aria-label="すべてクリア">
        <svg class="puff" viewBox="0 0 24 24" aria-hidden="true"><path class="rays" d="M12.00 6.80L12.00 2.40M14.60 7.50L16.80 3.69M16.50 9.40L20.31 7.20M17.20 12.00L21.60 12.00M16.50 14.60L20.31 16.80M14.60 16.50L16.80 20.31M12.00 17.20L12.00 21.60M9.40 16.50L7.20 20.31M7.50 14.60L3.69 16.80M6.80 12.00L2.40 12.00M7.50 9.40L3.69 7.20M9.40 7.50L7.20 3.69"/></svg>すべてクリア
      </button>
    </div>
    <main class="sheet" id="sheet"></main>
  </section>

  <div class="pad" id="pad">
    <button class="k sm keep" id="kABC" data-k="abc" aria-pressed="false">あいう</button>
    <button class="k sm" data-k="left">◀</button>
    <button class="k sm" data-k="right">▶</button>
    <button class="k sm" data-k="delrow">行削除</button>
    <button class="k sm keep" data-k="copy">コピー</button>

    <button class="k" data-k="7">7</button>
    <button class="k" data-k="8">8</button>
    <button class="k" data-k="9">9</button>
    <button class="k op" data-k="÷">÷</button>
    <button class="k op" data-k="bs" aria-label="1文字消す">⌫</button>

    <button class="k" data-k="4">4</button>
    <button class="k" data-k="5">5</button>
    <button class="k" data-k="6">6</button>
    <button class="k op" data-k="×">×</button>
    <button class="k op par" data-k="(">(</button>

    <button class="k" data-k="1">1</button>
    <button class="k" data-k="2">2</button>
    <button class="k" data-k="3">3</button>
    <button class="k op" data-k="−">−</button>
    <button class="k op par" data-k=")">)</button>

    <button class="k" data-k="0">0</button>
    <button class="k" data-k="00">00</button>
    <button class="k" data-k=".">.</button>
    <button class="k op" data-k="+">+</button>
    <button class="k enter" data-k="enter" aria-label="改行">↵</button>
  </div>
</div>

<div id="overlay"></div>
<div id="toastHost"></div>

<script>
(() => {
"use strict";
const DAY = 864e5, KEEP_DAYS = 30, LS_KEY = "keisan-note-v1", NCOL = 6;
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

/* ---------- evaluator ---------- */
function normalize(s){
  return s
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．]/g, ".").replace(/[＋]/g, "+").replace(/[−－‐]/g, "-")
    .replace(/[×＊]/g, "*").replace(/[÷／]/g, "/")
    .replace(/[（]/g, "(").replace(/[）]/g, ")").replace(/[％]/g, "%")
    .replace(/[,，]/g, "")
    .replace(/[^0-9.+\-*/()%]+/g, " ")
    .replace(/([0-9.]) +(?=[0-9.])/g, "$1?")
    .replace(/ /g, "");
}
function splitLabel(raw){
  const m = raw.match(/^([^:：]*)[:：](.*)$/);
  return m ? {label: m[1].trim(), expr: m[2]} : {label: "", expr: raw};
}
function evaluate(src){
  let s = src.replace(/[+\-*/]+$/, "");
  const toks = [];
  for (let i = 0; i < s.length;){
    const c = s[i];
    const num = s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);
    if (num){ toks.push({t:"n", v:parseFloat(num[1])}); i += num[1].length; continue; }
    if ("+-*/()%".includes(c)){ toks.push({t:c}); i++; continue; }
    throw new Error("式を確認");
  }
  let depth = 0; for (const t of toks){ if (t.t==="(") depth++; if (t.t===")") depth--; }
  while (depth-- > 0) toks.push({t:")"});
  let p = 0;
  const peek = () => toks[p] && toks[p].t;
  function expr(){ let v = term(); while (peek()==="+"||peek()==="-"){ const o = toks[p++].t; const r = term(); v = o==="+" ? v+r : v-r; } return v; }
  function term(){ let v = unary(); while (peek()==="*"||peek()==="/"){ const o = toks[p++].t; const r = unary(); if (o==="/" && r===0) throw new Error("0で割れません"); v = o==="*" ? v*r : v/r; } return v; }
  function unary(){ if (peek()==="-"){ p++; return -unary(); } if (peek()==="+"){ p++; return unary(); } return post(); }
  function post(){ let v = prim(); while (peek()==="%"){ p++; v = v/100; } return v; }
  function prim(){
    const t = toks[p];
    if (!t) throw new Error("式が途中です");
    if (t.t==="n"){ p++; return t.v; }
    if (t.t==="("){ p++; const v = expr(); if (peek()!==")") throw new Error("かっこを確認"); p++; return v; }
    throw new Error("式を確認");
  }
  if (!toks.length) return null;
  const v = expr();
  if (p < toks.length) throw new Error("式を確認");
  if (!isFinite(v)) throw new Error("計算できません");
  return parseFloat(v.toPrecision(14));
}
const fmt = new Intl.NumberFormat("ja-JP", {maximumFractionDigits: 8});

// A line starting with an operator continues from the answer of the line directly above.
function compute(lines){
  const out = lines.map(() => ({value:null, err:"", chained:false, used:false}));
  lines.forEach((raw, i) => {
    const r = out[i];
    let e = normalize(splitLabel(raw).expr);
    if (!e) return;
    const prev = i > 0 ? out[i-1] : null;
    if (/^[+\-*/%]/.test(e) && prev && prev.value !== null){
      e = "(" + prev.value + ")" + e; r.chained = true; prev.used = true;
    }
    try { r.value = evaluate(e); } catch(err){ r.err = err.message; }
  });
  return out;
}

/* ---------- state ---------- */
function seed(){
  const a = {id: uid(), name: "A", c: 0, lines: ["月給: 300000", "交通費: −10000", "年額: ×12", ""]};
  return {v: 2, tabs:[a, {id:uid(), name:"B", c:1, lines:[""]}, {id:uid(), name:"C", c:2, lines:[""]}, {id:uid(), name:"D", c:3, lines:[""]}], activeId: a.id, archive: [], updatedAt: 0};
}
function migrate(s){
  if (!s || !Array.isArray(s.tabs) || !s.tabs.length) return null;
  if (!Array.isArray(s.archive)) s.archive = [];
  if (s.v !== 2){
    s.tabs.forEach((t, i) => { t.name = LETTERS[i] || String(i + 1); t.c = i % NCOL; });
    s.archive.forEach((a, i) => { if (a.c === undefined) a.c = i % NCOL; });
    s.v = 2;
  }
  const extra = s.tabs.slice(4);
  extra.forEach(t => { if (t.lines.some(l => l.trim())) s.archive.unshift({id: uid(), name: t.name, c: 0, lines: t.lines.slice(), archivedAt: Date.now()}); });
  s.tabs = s.tabs.slice(0, 4);
  while (s.tabs.length < 4) s.tabs.push({id: uid(), lines: [""]});
  s.tabs.forEach((t, i) => { t.name = "ABCD"[i]; t.c = 0; });
  if (!s.tabs.some(t => t.id === s.activeId)) s.activeId = s.tabs[0].id;
  return s;
}
let S = null;
try { const j = localStorage.getItem(LS_KEY); if (j) S = migrate(JSON.parse(j)); } catch(e){}
if (!S) S = seed();
let cur = {i: 0, pos: 0};
let mode = "123";
let docRef = null, saveTimer = null, saving = Promise.resolve();

const tab = () => S.tabs.find(t => t.id === S.activeId) || S.tabs[0];
const nextLetter = () => LETTERS.split("").find(l => !S.tabs.some(t => t.name === l)) || String(S.tabs.length + 1);
const nextColor = () => { for (let c = 0; c < NCOL; c++) if (!S.tabs.some(t => t.c === c)) return c; return S.tabs.length % NCOL; };

function purgeArchive(){
  const now = Date.now(), before = S.archive.length;
  S.archive = S.archive.filter(a => now - a.archivedAt < KEEP_DAYS * DAY);
  return S.archive.length !== before;
}
function scheduleSave(){
  S.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!docRef) return;
    const body = JSON.parse(JSON.stringify(S));
    saving = saving.then(() => docRef.set(body)).catch(() => {});
  }, 700);
}

/* ---------- rendering ---------- */
const sheet = $("#sheet"), app = $("#app");
const bounce = el => { if (!el) return; el.classList.remove("poyon"); void el.offsetWidth; el.classList.add("poyon"); };

function renderTags(){
  const el = $("#tags"); el.textContent = "";
  S.tabs.forEach((t, idx) => {
    const b = document.createElement("button");
    b.className = "tagb"; b.setAttribute("role", "tab"); b.dataset.id = t.id;
    b.setAttribute("aria-selected", t.id === S.activeId ? "true" : "false");
    b.textContent = t.name;
    b.onclick = () => {
      if (t.id === S.activeId) return;
      S.activeId = t.id; const n = t.lines.length - 1; cur = {i: n, pos: t.lines[n].length};
      scheduleSave(); renderTags(); renderSheet(); focusCur();
      const nb = el.querySelector('[data-id="' + t.id + '"]'); if (nb) nb.classList.add("pop"); sheet.classList.remove("fade"); void sheet.offsetWidth; sheet.classList.add("fade");
    };
    el.appendChild(b);
  });
  app.classList.toggle("first", S.tabs[0].id === S.activeId);
  const n = $("#archN"); n.textContent = S.archive.length; n.hidden = !S.archive.length;
}
window.addEventListener("resize", () => { clearTimeout(window._rs); window._rs = setTimeout(() => { if (sheet.scrollHeight <= sheet.clientHeight) { renderSheet(); if (document.activeElement && document.activeElement.classList.contains("ex")) focusCur(); } }, 150); });

function renderSheet(){
  const t = tab();
  sheet.textContent = "";
  t.lines.forEach((line, i) => {
    const row = document.createElement("div"); row.className = "row"; row.dataset.i = i;
    const ln = document.createElement("span"); ln.className = "ln"; ln.textContent = i + 1;
    const inp = document.createElement("div");
    inp.className = "ex"; inp.id = "ex-" + t.id + "-" + i; inp.contentEditable = "true";
    inp.setAttribute("role", "textbox"); inp.setAttribute("inputmode", mode === "123" ? "none" : "text");
    inp.setAttribute("autocapitalize", "off"); inp.spellcheck = false; inp.setAttribute("aria-label", (i+1) + "行目");
    paint(inp, line);
    inp.addEventListener("focus", () => setTimeout(() => setCur(i, caretOf(inp), false), 0));
    inp.addEventListener("compositionstart", () => { composing = true; });
    inp.addEventListener("compositionend", () => { composing = false; syncFrom(inp, i); });
    inp.addEventListener("input", e => { if (composing || e.isComposing) { t.lines[i] = textOf(inp); update(); return; } syncFrom(inp, i); });
    inp.addEventListener("paste", e => { e.preventDefault(); const tx = (e.clipboardData && e.clipboardData.getData("text/plain") || "").replace(/[\r\n]+/g, " "); cur = {i, pos: caretOf(inp)}; insert(tx); });
    inp.addEventListener("keydown", onKeydown);
    const res = document.createElement("output"); res.className = "res";
    row.append(ln, inp, res);
    row.addEventListener("click", e => { if (!inp.contains(e.target)) setCur(i, textOf(inp).length); });
    sheet.appendChild(row);
  });
  // empty numbered lines fill the rest of the screen; tapping one starts typing there
  const rowH = 42, fill = Math.ceil(sheet.clientHeight / rowH) + 1;
  for (let k = t.lines.length; k < Math.max(fill, t.lines.length + 3); k++){
    const g = document.createElement("div"); g.className = "row ghost";
    const ln = document.createElement("span"); ln.className = "ln"; ln.textContent = k + 1;
    g.appendChild(ln);
    g.addEventListener("click", () => {
      while (t.lines.length <= k) t.lines.push("");
      cur = {i: k, pos: 0}; renderSheet(); focusCur(); scheduleSave();
    });
    sheet.appendChild(g);
  }
  update();
}

function update(){
  const rows = compute(tab().lines);
  sheet.querySelectorAll(".row:not(.ghost)").forEach((row, i) => {
    const r = rows[i]; if (!r) return;
    row.classList.toggle("chained", r.chained);
    row.classList.toggle("cur", i === cur.i);
    const res = row.querySelector(".res");
    res.className = "res"; res.textContent = "";
    if (r.err){ res.classList.add("err"); res.textContent = r.err; return; }
    if (r.value === null) return;
    if (r.used) res.classList.add("used");
    res.textContent = fmt.format(r.value);
  });
}
function renderAll(){ renderTags(); renderSheet(); }

/* contenteditable helpers: plain text in, math characters in ink, everything else small and grey */
let composing = false;
const MATH = /[0-9０-９.．,，+＋\-−－×＊*÷／/()（）%％:：\s　]/;
function textOf(el){ return (el.textContent || "").replace(/\n/g, ""); }
function paint(el, text){
  el.textContent = "";
  let run = "", kind = null;
  const flush = () => { if (!run) return; if (kind === "tx"){ const s = document.createElement("span"); s.className = "tx"; s.textContent = run; el.appendChild(s); } else el.appendChild(document.createTextNode(run)); run = ""; };
  for (const ch of text){ const k = MATH.test(ch) ? "m" : "tx"; if (k !== kind){ flush(); kind = k; } run += ch; }
  flush();
}
function caretOf(el){
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !el.contains(sel.anchorNode)) return textOf(el).length;
  const r = document.createRange(); r.selectNodeContents(el); r.setEnd(sel.anchorNode, sel.anchorOffset);
  return r.toString().length;
}
function setCaret(el, pos){
  const sel = window.getSelection(); if (!sel) return;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let n, left = pos, r = document.createRange();
  while ((n = w.nextNode())){ if (left <= n.length){ r.setStart(n, left); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); return; } left -= n.length; }
  r.selectNodeContents(el); r.collapse(false); sel.removeAllRanges(); sel.addRange(r);
}
function syncFrom(el, i){
  const t = tab(), pos = caretOf(el), text = textOf(el);
  t.lines[i] = text; paint(el, text); setCaret(el, pos); cur = {i, pos};
  update(); scheduleSave();
}
document.addEventListener("selectionchange", () => {
  const el = document.activeElement;
  if (el && el.classList && el.classList.contains("ex") && !composing){ const i = +el.closest(".row").dataset.i; if (i === cur.i) cur.pos = caretOf(el); }
});

function input(i){ return sheet.querySelector('.row[data-i="' + i + '"] .ex'); }
function setCur(i, pos, focus = true){
  cur = {i, pos};
  sheet.querySelectorAll(".row").forEach(r => r.classList.toggle("cur", +r.dataset.i === i));
  if (focus) focusCur();
}
function focusCur(){
  const el = input(cur.i); if (!el) return;
  if (document.activeElement !== el) el.focus({preventScroll: true});
  setCaret(el, cur.pos);
  el.closest(".row").scrollIntoView({block: "nearest"});
}

/* ---------- editing ---------- */
function insert(text){
  const t = tab(), line = t.lines[cur.i] ?? "";
  t.lines[cur.i] = line.slice(0, cur.pos) + text + line.slice(cur.pos);
  cur.pos += text.length;
  const el = input(cur.i); if (el) paint(el, t.lines[cur.i]);
  update(); focusCur(); scheduleSave();
}
function backspace(){
  const t = tab(), line = t.lines[cur.i];
  if (cur.pos > 0){
    t.lines[cur.i] = line.slice(0, cur.pos - 1) + line.slice(cur.pos); cur.pos--;
    paint(input(cur.i), t.lines[cur.i]); update(); focusCur(); scheduleSave();
  } else if (cur.i > 0){
    const prevLen = t.lines[cur.i - 1].length;
    t.lines[cur.i - 1] += line; t.lines.splice(cur.i, 1);
    cur = {i: cur.i - 1, pos: prevLen}; renderSheet(); focusCur(); scheduleSave();
  }
}
function newline(){
  const t = tab(), line = t.lines[cur.i];
  t.lines[cur.i] = line.slice(0, cur.pos);
  t.lines.splice(cur.i + 1, 0, line.slice(cur.pos));
  cur = {i: cur.i + 1, pos: 0}; renderSheet(); focusCur(); scheduleSave();
}
function move(d){
  const t = tab(), len = t.lines[cur.i].length;
  if (d < 0 && cur.pos > 0) cur.pos--;
  else if (d < 0 && cur.i > 0){ cur.i--; cur.pos = t.lines[cur.i].length; }
  else if (d > 0 && cur.pos < len) cur.pos++;
  else if (d > 0 && cur.i < t.lines.length - 1){ cur.i++; cur.pos = 0; }
  setCur(cur.i, cur.pos);
}
function deleteRow(){
  const t = tab();
  if (t.lines.length === 1){ t.lines[0] = ""; cur.pos = 0; paint(input(0), ""); update(); focusCur(); scheduleSave(); return; }
  t.lines.splice(cur.i, 1);
  cur.i = Math.min(cur.i, t.lines.length - 1); cur.pos = t.lines[cur.i].length;
  renderSheet(); focusCur(); scheduleSave();
}
function onKeydown(e){
  if (e.isComposing || e.keyCode === 229) return;
  const el = e.currentTarget; cur.pos = caretOf(el);
  const collapsed = window.getSelection().isCollapsed;
  if (e.key === "Enter"){ e.preventDefault(); newline(); }
  else if (e.key === "Backspace" && collapsed && cur.pos === 0 && cur.i > 0){ e.preventDefault(); backspace(); }
  else if (e.key === "ArrowUp" && cur.i > 0){ e.preventDefault(); setCur(cur.i - 1, Math.min(cur.pos, tab().lines[cur.i - 1].length)); }
  else if (e.key === "ArrowDown" && cur.i < tab().lines.length - 1){ e.preventDefault(); setCur(cur.i + 1, Math.min(cur.pos, tab().lines[cur.i + 1].length)); }
}

document.querySelectorAll(".k").forEach(b => {
  b.addEventListener("pointerdown", e => { e.preventDefault(); b.classList.add("pressed"); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, () => b.classList.remove("pressed")));
  b.addEventListener("click", () => {
    const k = b.dataset.k;
    if (k === "bs") backspace();
    else if (k === "enter") newline();
    else if (k === "left") move(-1);
    else if (k === "right") move(1);
    else if (k === "delrow") deleteRow();
    else if (k === "abc") setMode(mode === "123" ? "ABC" : "123");
    else if (k === "copy") copyTable();
    else insert(k);
  });
});

function setMode(m){
  mode = m;
  $("#kABC").setAttribute("aria-pressed", m === "ABC"); $("#kABC").textContent = m === "ABC" ? "123" : "あいう";
  $("#pad").classList.toggle("hide", m === "ABC");
  sheet.querySelectorAll(".ex").forEach(x => x.setAttribute("inputmode", m === "123" ? "none" : "text"));
  const el = input(cur.i); if (el){ el.blur(); setTimeout(focusCur, 60); }
}

/* ---------- toast / panels ---------- */
function toast(msg, undoFn){
  const host = $("#toastHost"); host.textContent = "";
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  const s = document.createElement("span"); s.textContent = msg; t.appendChild(s);
  if (undoFn){ const u = document.createElement("button"); u.textContent = "元に戻す"; u.onclick = () => { host.textContent = ""; undoFn(); }; t.appendChild(u); }
  host.appendChild(t);
  clearTimeout(toast.tm); toast.tm = setTimeout(() => { host.textContent = ""; }, 5000);
}
function closeOverlay(){ $("#overlay").textContent = ""; focusCur(); }
function panel(title){
  const scrim = document.createElement("div"); scrim.className = "scrim";
  scrim.addEventListener("click", e => { if (e.target === scrim) closeOverlay(); });
  const p = document.createElement("div"); p.className = "panel"; p.setAttribute("role", "dialog"); p.setAttribute("aria-label", title);
  const h = document.createElement("div"); h.className = "phead";
  const h2 = document.createElement("h2"); h2.textContent = title;
  const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", "閉じる"); x.onclick = closeOverlay;
  h.append(h2, x);
  const body = document.createElement("div"); body.className = "pbody";
  p.append(h, body); scrim.appendChild(p);
  $("#overlay").textContent = ""; $("#overlay").appendChild(scrim);
  return body;
}

/* ---------- clear / archive ---------- */
function archiveTab(t){
  if (!t.lines.some(l => l.trim())) return null;
  const entry = {id: uid(), name: t.name, c: t.c, lines: t.lines.slice(), archivedAt: Date.now()};
  S.archive.unshift(entry);
  return entry;
}
$("#btnClear").onclick = () => {
  const bc = $("#btnClear"); bc.classList.remove("blow"); void bc.offsetWidth; bc.classList.add("blow");
  const t = tab();
  const entry = archiveTab(t);
  if (!entry){ toast("クリアしました"); return; }
  const before = t.lines.slice();
  t.lines = [""]; cur = {i:0, pos:0};
  scheduleSave(); renderAll(); focusCur();
  bounce($("#btnArchive"));
  toast("クリアしました", () => {
    t.lines = before; S.archive = S.archive.filter(a => a.id !== entry.id);
    cur = {i: before.length - 1, pos: before[before.length - 1].length};
    scheduleSave(); renderAll(); focusCur();
  });
};

function openArchive(){
  if (purgeArchive()) scheduleSave();
  const body = panel("アーカイブ");
  const sub = document.createElement("p"); sub.className = "sub"; sub.textContent = "クリアした内容は30日で自動的に消えます。"; body.appendChild(sub);
  if (!S.archive.length){
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "まだありません";
    body.appendChild(e);
  }
  const df = new Intl.DateTimeFormat("ja-JP", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
  S.archive.forEach(a => {
    const it = document.createElement("div"); it.className = "aitem";
    const left = Math.max(1, Math.ceil((a.archivedAt + KEEP_DAYS*DAY - Date.now()) / DAY));
    const head = document.createElement("div"); head.className = "ahead";
    const sp = document.createElement("span"); sp.textContent = df.format(a.archivedAt) + "・あと" + left + "日";
    head.append(sp);
    const pre = document.createElement("div"); pre.className = "apre";
    const shown = a.lines.filter(l => l.trim());
    pre.textContent = shown.slice(0, 4).join("\n") + (shown.length > 4 ? "\n…ほか" + (shown.length - 4) + "行" : "");
    const foot = document.createElement("div"); foot.className = "afoot";
    const del = document.createElement("button"); del.className = "btn danger"; del.textContent = "削除";
    del.onclick = () => {
      if (del.dataset.confirm){ S.archive = S.archive.filter(x => x.id !== a.id); scheduleSave(); renderTags(); openArchive(); }
      else { del.dataset.confirm = "1"; del.textContent = "本当に削除"; }
    };
    const res = document.createElement("button"); res.className = "btn pri"; res.textContent = "戻す";
    res.onclick = () => {
      const isEmpty = x => x.lines.every(l => !l.trim());
      let t = isEmpty(tab()) ? tab() : S.tabs.find(isEmpty);
      let moved = false;
      if (!t){ t = tab(); archiveTab(t); moved = true; }
      t.lines = a.lines.slice(); S.activeId = t.id;
      S.archive = S.archive.filter(x => x.id !== a.id);
      cur = {i: t.lines.length - 1, pos: t.lines[t.lines.length - 1].length};
      scheduleSave(); renderAll(); closeOverlay();
      toast(moved ? t.name + " に戻しました（元の内容はアーカイブへ）" : t.name + " に戻しました");
    };
    foot.append(del, res);
    it.append(head, pre, foot); body.appendChild(it);
  });
}
$("#btnArchive").onclick = openArchive;

function openRename(t){
  const body = panel("タグ " + t.name);
  const d = document.createElement("div"); d.className = "dlg";
  const lab = document.createElement("label"); lab.textContent = "名前"; lab.htmlFor = "tagName";
  const inp = document.createElement("input"); inp.id = "tagName"; inp.value = t.name; inp.maxLength = 12;
  const r = document.createElement("div"); r.className = "row2";
  const del = document.createElement("button"); del.className = "btn danger"; del.textContent = "このタグを閉じる";
  del.disabled = S.tabs.length <= 1;
  del.onclick = () => {
    const entry = archiveTab(t);
    const idx = S.tabs.indexOf(t); S.tabs.splice(idx, 1);
    S.activeId = S.tabs[Math.max(0, idx - 1)].id;
    const nt = tab(); cur = {i: nt.lines.length - 1, pos: nt.lines[nt.lines.length - 1].length};
    scheduleSave(); renderAll(); closeOverlay();
    toast(entry ? "閉じて、内容をアーカイブに移しました" : "タグを閉じました");
  };
  const right = document.createElement("div");
  const ok = document.createElement("button"); ok.className = "btn pri"; ok.textContent = "保存";
  const save = () => { t.name = inp.value.trim() || t.name; scheduleSave(); renderTags(); closeOverlay(); };
  ok.onclick = save; inp.addEventListener("keydown", e => { if (e.key === "Enter") save(); });
  right.append(ok); r.append(del, right);
  d.append(lab, inp, r); body.appendChild(d);
  setTimeout(() => inp.focus(), 60);
}

$("#btnHelp").onclick = () => {
  const body = panel("使い方");
  const h = document.createElement("div"); h.className = "help";
  h.innerHTML =
    "<div><h3>上の行の答えに続けて計算</h3><p>記号（＋ − × ÷）で始めると、すぐ上の行の答えを使います。<br><code>300000−10000</code> の次の行に <code>×12</code> → 3,480,000</p></div>" +
    "<div><h3>見出しをつける</h3><p><code>家賃: 80000</code> のように、コロンの前は見出しになります。</p></div>" +

/* ---------- copy for spreadsheet ---------- */
async function copyTable(){
  const t = tab(), rows = compute(t.lines);
  const out = [];
  t.lines.forEach((l, i) => {
    if (!l.trim()) return;
    let ex = l.trim(); if (/^[=+\-−]/.test(ex)) ex = " " + ex;
    out.push(ex + "\t" + (rows[i].value === null ? "" : rows[i].value));
  });
  const text = out.join("\n");
  if (!text){ toast("コピーする行がありません"); return; }
  try { await navigator.clipboard.writeText(text); toast("コピーしました"); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(_){}
    ta.remove(); toast(ok ? "コピーしました" : "コピーできませんでした"); focusCur();
  }
}

if (purgeArchive()) scheduleSave();
{ const t = tab(); cur = {i: t.lines.length - 1, pos: t.lines[t.lines.length - 1].length}; }
renderAll();

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/notebook");
    const snap = await ref.get();
    docRef = ref;
    const remote = snap.exists ? migrate(JSON.parse(JSON.stringify(snap.data()))) : null;
    if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)){
      S = remote;
      purgeArchive();
      const t = tab(); cur = {i: t.lines.length - 1, pos: t.lines[t.lines.length - 1].length};
      renderAll();
      scheduleSave();
    } else if (S.updatedAt){
      scheduleSave();
    }
  } catch(e){ /* keeps working with this device's storage */ }
})();
})();
